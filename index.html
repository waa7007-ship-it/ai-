<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 단어 카드</title>

  <!-- 귀여운 글꼴 (인터넷이 안 되면 컴퓨터에 있는 기본 글꼴로 보여요) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <!-- ===================== CSS (모양 꾸미기) ===================== -->
  <style>
    /* ---------- 자주 쓰는 파스텔 색깔을 이름 붙여 모아 두기 ---------- */
    :root {
      --pink:        #ffb3cc;
      --pink-dark:   #f06292;
      --peach:       #ffd8b1;
      --yellow:      #fff1a8;
      --mint:        #b8f2d0;
      --mint-dark:   #2e9e62;
      --sky:         #bfe3ff;
      --sky-dark:    #1e88e5;
      --lavender:    #dccbff;
      --lavender-dark: #7c5cd6;
      --text:        #4a4a5a;
      --white:       #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: linear-gradient(160deg, #fff7e0 0%, #ffe3ef 45%, #e3f1ff 100%);
      min-height: 100%;
    }

    /* 화면 한 개 높이 안에 모두 들어가도록 세로로 가운데 정렬 */
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;   /* 휴대폰 주소창 높이까지 생각한 화면 높이 */
      font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 20px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
    }

    /* 화면 가운데 모아 두는 상자 */
    .wrap {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: normal;
      color: var(--pink-dark);
      text-shadow: 3px 3px 0 var(--white);
      text-align: center;
    }

    /* ---------- 진행 상황 (몇 개 외웠는지) ---------- */
    .progress-box {
      width: 100%;
      background: var(--white);
      border-radius: 20px;
      padding: 10px 16px 12px;
      box-shadow: 0 6px 16px rgba(240, 98, 146, 0.15);
    }

    /* 글자와 '처음부터' 버튼을 한 줄에 */
    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .progress-text {
      font-size: 1.2rem;
    }

    .progress-text b {
      color: var(--pink-dark);
      font-weight: normal;
      font-size: 1.35rem;
    }

    .progress-bar {
      width: 100%;
      height: 20px;
      background: #f3eef7;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--mint), #8fe3b3, var(--sky));
      border-radius: 999px;
      transition: width 0.5s;
    }

    .reset-btn {
      flex-shrink: 0;
      border: 2px solid #e6dcef;
      background: #faf7fc;
      color: #a99bb8;
      font-family: inherit;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* ---------- 주제 고르기 버튼 (6개를 한 줄에) ---------- */
    .topics {
      width: 100%;
      display: flex;
      gap: 6px;
    }

    .topic-btn {
      flex: 1 1 0;           /* 6개가 같은 너비로 한 줄에 */
      min-width: 0;
      font-family: inherit;
      font-size: 1rem;
      border: 3px solid var(--pink);
      background: var(--white);
      color: var(--pink-dark);
      padding: 8px 4px;
      min-height: 48px;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s;
    }

    .topic-btn:hover {
      transform: scale(1.05);
    }

    /* 지금 선택된 주제 */
    .topic-btn.active {
      background: var(--pink);
      color: var(--white);
    }

    /* ---------- 카드 (뒤집기 애니메이션) ---------- */
    .card-area {
      width: 100%;
      max-width: 420px;
      height: 190px;          /* 예전(380px)의 절반 크기 */
      perspective: 1000px;   /* 3D 느낌을 주는 설정 */
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }

    /* 'flipped' 표시가 붙으면 카드가 180도 돌아가요 */
    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: var(--white);
      box-shadow: 0 10px 24px rgba(124, 92, 214, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      text-align: center;
      backface-visibility: hidden;          /* 뒤쪽 면은 안 보이게 */
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      border: 6px solid var(--yellow);
    }

    .card-back {
      border: 6px solid var(--sky);
      transform: rotateY(180deg);           /* 뒷면은 처음부터 돌려 놓기 */
    }

    /* 외운 카드는 테두리가 민트색 */
    .card.learned .card-front {
      border-color: var(--mint);
    }

    /* 카드 구석에 붙는 작은 표시들 */
    .badge {
      position: absolute;
      font-size: 0.8rem;
      padding: 2px 10px;
      border-radius: 999px;
    }

    .badge-learned {
      top: 8px;
      right: 8px;
      background: var(--mint);
      color: var(--mint-dark);
      display: none;
    }

    .card.learned .badge-learned {
      display: block;
    }

    .badge-mine {
      top: 8px;
      left: 8px;
      background: var(--lavender);
      color: var(--lavender-dark);
      display: none;
    }

    .card.mine .badge-mine {
      display: block;
    }

    /* 몇 번째 카드인지 (카드 오른쪽 아래) */
    .counter {
      bottom: 8px;
      right: 10px;
      color: #b5abc2;
    }

    /* 내가 만든 카드 지우기 버튼 (카드 왼쪽 아래) */
    .delete-btn {
      position: absolute;
      bottom: 6px;
      left: 8px;
      font-family: inherit;
      font-size: 0.8rem;
      border: none;
      background: #ffe0e0;
      color: #c0506a;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .emoji {
      font-size: 3.4rem;
      line-height: 1.1;
    }

    .word {
      font-size: 2rem;
      word-break: break-word;
    }

    .meaning {
      font-size: 1.9rem;
      color: var(--sky-dark);
      margin-bottom: 8px;
      word-break: break-word;
    }

    .example {
      font-size: 1.1rem;
      background: #eef7ff;
      padding: 8px 14px;
      border-radius: 14px;
      word-break: break-word;
    }

    .hint {
      margin-top: 4px;
      font-size: 0.8rem;
      color: #b5abc2;
    }

    /* ---------- 큰 버튼들 ---------- */
    .row {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .btn {
      font-family: inherit;
      font-size: 1.15rem;
      border: none;
      color: var(--text);
      padding: 10px 12px;
      min-height: 54px;
      border-radius: 18px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
      transition: transform 0.1s;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.1);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* 한 줄에 있는 버튼들은 같은 너비로 나눠 갖기 */
    .row .btn {
      flex: 1 1 0;
      min-width: 0;
    }

    .btn-big { font-size: 1.3rem; min-height: 60px; }

    .btn-learned { background: var(--mint); }
    .btn-again   { background: var(--peach); }
    .btn-move    { background: var(--yellow); }
    .btn-speak   { background: var(--sky); }
    .btn-shuffle { background: var(--lavender); }
    .btn-add     { background: var(--pink); width: 100%; }
    .btn-open    { background: var(--white); border: 3px dashed var(--lavender); color: var(--lavender-dark); width: 100%; }

    /* ---------- 팝업 창 (축하 창, 단어 만들기 창) ---------- */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(255, 240, 248, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      position: relative;
      background: var(--white);
      border-radius: 32px;
      padding: 24px 20px;
      max-width: 440px;
      width: 100%;
      max-height: 100%;
      overflow-y: auto;      /* 아주 작은 화면이면 창 안에서만 스크롤 */
      box-shadow: 0 16px 40px rgba(240, 98, 146, 0.25);
      animation: pop 0.4s;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: #f3eef7;
      font-size: 1.3rem;
      cursor: pointer;
    }

    /* 단어 만들기 창 */
    .add-box {
      border: 6px solid var(--lavender);
    }

    .add-box h2 {
      margin: 0 0 12px;
      font-size: 1.6rem;
      font-weight: normal;
      color: var(--lavender-dark);
      text-align: center;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .field input,
    .field select {
      width: 100%;
      font-family: inherit;
      font-size: 1.2rem;
      padding: 10px 14px;
      border: 3px solid var(--lavender);
      border-radius: 14px;
      background: #fcfaff;
      color: var(--text);
    }

    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: var(--lavender-dark);
    }

    /* 이모지칸과 주제칸을 한 줄에 나란히 */
    .field-pair {
      display: flex;
      gap: 10px;
    }

    .field-pair .field {
      flex: 1;
    }

    .message {
      min-height: 1.5em;
      text-align: center;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .message.ok    { color: var(--mint-dark); }
    .message.error { color: var(--pink-dark); }

    /* 축하 창 */
    .celebrate-box {
      border: 8px solid var(--yellow);
      text-align: center;
    }

    .celebrate-emoji {
      font-size: 5rem;
      animation: bounce 1s infinite;
    }

    .celebrate-box h2 {
      font-size: 2.2rem;
      font-weight: normal;
      color: var(--pink-dark);
      margin: 10px 0;
    }

    .celebrate-box p {
      font-size: 1.3rem;
      margin: 0 0 20px;
    }

    @keyframes pop {
      0%   { transform: scale(0.5); opacity: 0; }
      80%  { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }

    /* 떨어지는 색종이 */
    .confetti {
      position: fixed;
      top: -40px;
      font-size: 2rem;
      pointer-events: none;
      z-index: 11;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(540deg); }
    }

    /* ---------- 휴대폰처럼 좁은 화면일 때 ---------- */
    @media (max-width: 480px) {
      body           { font-size: 17px; padding: 10px 12px; }
      h1             { font-size: 1.7rem; }
      .wrap          { gap: 10px; }
      .progress-text { font-size: 1.05rem; }

      /* 주제 버튼: 이모지를 위, 글자를 아래로 놓아 한 줄에 쏙 */
      .topics     { gap: 4px; }
      .topic-btn  {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 0.85rem;
        padding: 4px 2px;
        border-width: 2px;
        border-radius: 12px;
      }
      .topic-btn .t-emoji { font-size: 1.3rem; }

      .btn       { font-size: 1rem; padding: 8px 4px; }
      .btn-big   { font-size: 1.2rem; }

      .field-pair {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>
<body>

  <!-- ===================== HTML (화면에 보이는 내용) ===================== -->
  <div class="wrap">

    <h1>🌈 영어 단어 카드</h1>

    <!-- 진행 상황 -->
    <div class="progress-box">
      <div class="progress-top">
        <div class="progress-text" id="progressText">20개 중 0개 외웠어요!</div>
        <button class="reset-btn" id="resetBtn">↺ 처음부터</button>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- 주제 고르기 (6개 한 줄) -->
    <div class="topics">
      <button class="topic-btn active" data-topic="전체"><span class="t-emoji">🌟</span> 전체</button>
      <button class="topic-btn" data-topic="동물"><span class="t-emoji">🐶</span> 동물</button>
      <button class="topic-btn" data-topic="과일"><span class="t-emoji">🍎</span> 과일</button>
      <button class="topic-btn" data-topic="색깔"><span class="t-emoji">🎨</span> 색깔</button>
      <button class="topic-btn" data-topic="학교"><span class="t-emoji">🏫</span> 학교</button>
      <button class="topic-btn" data-topic="내 단어"><span class="t-emoji">⭐</span> 내 단어</button>
    </div>

    <!-- 단어 카드 -->
    <div class="card-area">
      <div class="card" id="card">
        <!-- 앞면 -->
        <div class="card-face card-front">
          <span class="badge badge-mine">⭐ 내 단어</span>
          <span class="badge badge-learned">✅ 외웠어요</span>
          <div class="emoji" id="emoji">🐶</div>
          <div class="word" id="word">dog</div>
          <div class="hint">👆 눌러서 뒤집기</div>
          <button class="delete-btn" id="deleteBtn" hidden>🗑️ 지우기</button>
          <span class="badge counter" id="counter">1 / 20</span>
        </div>
        <!-- 뒷면 -->
        <div class="card-face card-back">
          <div class="meaning" id="meaning">개</div>
          <div class="example" id="example">I have a dog.</div>
          <div class="hint">👆 다시 누르면 앞면으로</div>
        </div>
      </div>
    </div>

    <!-- 외웠어요 / 다시 볼래요 -->
    <div class="row">
      <button class="btn btn-big btn-learned" id="learnedBtn">외웠어요 ✅</button>
      <button class="btn btn-big btn-again" id="againBtn">다시 볼래요 🔁</button>
    </div>

    <!-- 이전 / 발음 / 섞기 / 다음 (한 줄) -->
    <div class="row">
      <button class="btn btn-move" id="prevBtn">◀ 이전</button>
      <button class="btn btn-speak" id="speakBtn">🔊 발음</button>
      <button class="btn btn-shuffle" id="shuffleBtn">🔀 섞기</button>
      <button class="btn btn-move" id="nextBtn">다음 ▶</button>
    </div>

    <!-- 단어 만들기 창 열기 버튼 -->
    <button class="btn btn-open" id="openAddBtn">✏️ 나만의 단어 만들기</button>
  </div>

  <!-- 단어 만들기 창 (버튼을 누르면 나타나요) -->
  <div class="modal" id="addModal">
    <form class="modal-box add-box" id="addForm">
      <button type="button" class="close-btn" id="closeAddBtn" aria-label="닫기">✖</button>
      <h2>✏️ 나만의 단어 만들기</h2>

      <div class="field">
        <label for="inEnglish">영어 단어 *</label>
        <input id="inEnglish" type="text" placeholder="예: tiger" autocomplete="off">
      </div>

      <div class="field">
        <label for="inKorean">한국어 뜻 *</label>
        <input id="inKorean" type="text" placeholder="예: 호랑이" autocomplete="off">
      </div>

      <div class="field">
        <label for="inExample">영어 예문</label>
        <input id="inExample" type="text" placeholder="예: The tiger is fast." autocomplete="off">
      </div>

      <div class="field-pair">
        <div class="field">
          <label for="inEmoji">이모지</label>
          <input id="inEmoji" type="text" placeholder="예: 🐯" autocomplete="off">
        </div>
        <div class="field">
          <label for="inTopic">주제</label>
          <select id="inTopic">
            <option value="내 단어">⭐ 내 단어</option>
            <option value="동물">🐶 동물</option>
            <option value="과일">🍎 과일</option>
            <option value="색깔">🎨 색깔</option>
            <option value="학교">🏫 학교</option>
          </select>
        </div>
      </div>

      <div class="message" id="addMessage"></div>
      <button class="btn btn-add" type="submit">➕ 카드 추가하기</button>
    </form>
  </div>

  <!-- 축하 창 (평소에는 숨어 있어요) -->
  <div class="modal" id="celebrate">
    <div class="modal-box celebrate-box">
      <div class="celebrate-emoji">🏆</div>
      <h2>축하해요! 🎉</h2>
      <p id="celebrateText">단어를 모두 외웠어요!<br>정말 대단해요! 👏</p>
      <div class="row">
        <button class="btn btn-learned" id="closeCelebrateBtn">좋아요! 😊</button>
        <button class="btn btn-again" id="restartBtn">처음부터 🔁</button>
      </div>
    </div>
  </div>

  <!-- ===================== JavaScript (움직이게 하기) ===================== -->
  <script>
    // ------------------------------------------------------------
    // 1. 처음부터 들어 있는 단어 20개
    // ------------------------------------------------------------
    const baseWords = [
      // 동물
      { topic: "동물", english: "dog",      korean: "개",     emoji: "🐶", example: "I have a dog." },
      { topic: "동물", english: "cat",      korean: "고양이", emoji: "🐱", example: "The cat is sleeping." },
      { topic: "동물", english: "rabbit",   korean: "토끼",   emoji: "🐰", example: "The rabbit can jump." },
      { topic: "동물", english: "elephant", korean: "코끼리", emoji: "🐘", example: "The elephant is big." },
      { topic: "동물", english: "lion",     korean: "사자",   emoji: "🦁", example: "The lion is strong." },

      // 과일
      { topic: "과일", english: "apple",      korean: "사과",   emoji: "🍎", example: "I like apples." },
      { topic: "과일", english: "banana",     korean: "바나나", emoji: "🍌", example: "The banana is yellow." },
      { topic: "과일", english: "grape",      korean: "포도",   emoji: "🍇", example: "Grapes are sweet." },
      { topic: "과일", english: "strawberry", korean: "딸기",   emoji: "🍓", example: "I eat a strawberry." },
      { topic: "과일", english: "watermelon", korean: "수박",   emoji: "🍉", example: "Watermelon is good in summer." },

      // 색깔
      { topic: "색깔", english: "red",    korean: "빨간색", emoji: "🔴", example: "The apple is red." },
      { topic: "색깔", english: "blue",   korean: "파란색", emoji: "🔵", example: "The sky is blue." },
      { topic: "색깔", english: "yellow", korean: "노란색", emoji: "🟡", example: "The sun is yellow." },
      { topic: "색깔", english: "green",  korean: "초록색", emoji: "🟢", example: "The grass is green." },
      { topic: "색깔", english: "purple", korean: "보라색", emoji: "🟣", example: "I have a purple bag." },

      // 학교 물건
      { topic: "학교", english: "pencil", korean: "연필",   emoji: "✏️", example: "I write with a pencil." },
      { topic: "학교", english: "book",   korean: "책",     emoji: "📘", example: "I read a book." },
      { topic: "학교", english: "eraser", korean: "지우개", emoji: "🧽", example: "Can I use your eraser?" },
      { topic: "학교", english: "ruler",  korean: "자",     emoji: "📏", example: "This ruler is long." },
      { topic: "학교", english: "bag",    korean: "가방",   emoji: "🎒", example: "My bag is heavy." }
    ];

    // ------------------------------------------------------------
    // 2. 브라우저에 저장하고 불러오기 (localStorage)
    //    브라우저를 껐다 켜도 남아 있게 해 줘요.
    //    혹시 저장이 막힌 브라우저여도 페이지가 멈추지 않도록 try/catch로 감싸요.
    // ------------------------------------------------------------
    const SAVE_KEY_MY_WORDS = "wordcards-my-words";
    const SAVE_KEY_LEARNED  = "wordcards-learned";

    function loadData(key, defaultValue) {
      try {
        const text = localStorage.getItem(key);
        return text ? JSON.parse(text) : defaultValue;
      } catch (error) {
        return defaultValue;
      }
    }

    function saveData(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        // 저장할 수 없는 환경이면 조용히 넘어가요.
      }
    }

    // 내가 추가한 단어들
    let myWords = loadData(SAVE_KEY_MY_WORDS, []);
    // 외운 단어들 (영어 단어를 소문자로 모아 둔 목록)
    let learned = new Set(loadData(SAVE_KEY_LEARNED, []));

    function saveMyWords() { saveData(SAVE_KEY_MY_WORDS, myWords); }
    function saveLearned() { saveData(SAVE_KEY_LEARNED, [...learned]); }

    // 단어를 구별하는 이름표 (대문자/소문자 차이는 무시)
    function keyOf(word) {
      return word.english.trim().toLowerCase();
    }

    // ------------------------------------------------------------
    // 3. 지금 상태를 기억하는 변수
    // ------------------------------------------------------------
    let currentTopic = "전체";   // 지금 고른 주제
    let cards = [];              // 지금 보여 줄 카드 목록
    let currentIndex = 0;        // 지금 보고 있는 카드 번호 (0부터 시작)

    // 기본 단어 + 내가 만든 단어를 합친 전체 목록
    function getAllWords() {
      return baseWords.concat(myWords.map(function (w) {
        return Object.assign({}, w, { mine: true });
      }));
    }

    // 고른 주제에 맞는 카드만 골라서 cards에 넣기
    function buildCards() {
      const all = getAllWords();
      if (currentTopic === "전체") {
        cards = all;
      } else {
        cards = all.filter(function (w) { return w.topic === currentTopic; });
      }
    }

    // ------------------------------------------------------------
    // 4. 화면 요소 가져오기
    // ------------------------------------------------------------
    const cardEl       = document.getElementById("card");
    const emojiEl      = document.getElementById("emoji");
    const wordEl       = document.getElementById("word");
    const meaningEl    = document.getElementById("meaning");
    const exampleEl    = document.getElementById("example");
    const counterEl    = document.getElementById("counter");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const deleteBtn    = document.getElementById("deleteBtn");
    const celebrateEl  = document.getElementById("celebrate");
    const addModal     = document.getElementById("addModal");

    // 카드가 하나도 없을 때(예: '내 단어'를 아직 안 만들었을 때) 버튼 막기
    const cardButtons = ["learnedBtn", "againBtn", "prevBtn", "nextBtn", "speakBtn", "shuffleBtn"]
      .map(function (id) { return document.getElementById(id); });

    // ------------------------------------------------------------
    // 5. 지금 카드를 화면에 그리는 함수
    // ------------------------------------------------------------
    function showCard() {
      cardEl.classList.remove("flipped");   // 새 카드는 항상 앞면부터

      // 카드가 없으면 안내 문구 보여 주기
      if (cards.length === 0) {
        emojiEl.textContent   = "📭";
        wordEl.textContent    = "카드가 없어요";
        meaningEl.textContent = "아래 버튼으로 만들어 보세요!";
        exampleEl.textContent = "✏️ 나만의 단어 만들기";
        counterEl.textContent = "0 / 0";
        cardEl.classList.remove("learned", "mine");
        deleteBtn.hidden = true;
        cardButtons.forEach(function (b) { b.disabled = true; });
        updateProgress();
        return;
      }
      cardButtons.forEach(function (b) { b.disabled = false; });

      const item = cards[currentIndex];
      emojiEl.textContent   = item.emoji;
      wordEl.textContent    = item.english;
      meaningEl.textContent = item.korean;
      exampleEl.textContent = item.example || "(예문이 없어요)";
      counterEl.textContent = (currentIndex + 1) + " / " + cards.length;

      // 외운 카드, 내가 만든 카드 표시
      cardEl.classList.toggle("learned", learned.has(keyOf(item)));
      cardEl.classList.toggle("mine", !!item.mine);
      deleteBtn.hidden = !item.mine;

      updateProgress();
    }

    // ------------------------------------------------------------
    // 6. 진행 상황 (몇 개 외웠는지) 보여 주기
    // ------------------------------------------------------------
    function countLearned() {
      return cards.filter(function (w) { return learned.has(keyOf(w)); }).length;
    }

    function updateProgress() {
      const total = cards.length;
      const done  = countLearned();
      const percent = total === 0 ? 0 : Math.round((done / total) * 100);

      progressText.innerHTML = "";   // 비우고 다시 쓰기
      progressText.append(total + "개 중 ");
      const b = document.createElement("b");
      b.textContent = done + "개";
      progressText.append(b, " 외웠어요!");

      progressFill.style.width = percent + "%";
    }

    // ------------------------------------------------------------
    // 7. 카드 뒤집기 (카드를 클릭하면 실행)
    // ------------------------------------------------------------
    function flipCard() {
      if (cards.length > 0) cardEl.classList.toggle("flipped");
    }
    cardEl.addEventListener("click", flipCard);

    // ------------------------------------------------------------
    // 8. 이전 / 다음 버튼 (끝에서 넘기면 처음으로 돌아가요)
    // ------------------------------------------------------------
    function goNext() {
      if (cards.length === 0) return;
      currentIndex = (currentIndex + 1) % cards.length;
      showCard();
    }

    function goPrev() {
      if (cards.length === 0) return;
      currentIndex = (currentIndex - 1 + cards.length) % cards.length;
      showCard();
    }

    document.getElementById("nextBtn").addEventListener("click", goNext);
    document.getElementById("prevBtn").addEventListener("click", goPrev);

    // ------------------------------------------------------------
    // 9. 외웠어요 ✅ / 다시 볼래요 🔁
    // ------------------------------------------------------------
    function markLearned() {
      if (cards.length === 0) return;
      const wasAllDone = countLearned() === cards.length;

      learned.add(keyOf(cards[currentIndex]));
      saveLearned();

      // 방금 눌러서 전부 외우게 되었으면 축하!
      if (!wasAllDone && countLearned() === cards.length) {
        showCard();
        celebrate();
      } else {
        goNext();
      }
    }

    function markAgain() {
      if (cards.length === 0) return;
      learned.delete(keyOf(cards[currentIndex]));
      saveLearned();
      goNext();
    }

    document.getElementById("learnedBtn").addEventListener("click", markLearned);
    document.getElementById("againBtn").addEventListener("click", markAgain);

    // 외운 기록 지우기 (지금 고른 주제의 카드만)
    function resetLearned() {
      cards.forEach(function (w) { learned.delete(keyOf(w)); });
      saveLearned();
      currentIndex = 0;
      showCard();
    }

    document.getElementById("resetBtn").addEventListener("click", function () {
      if (confirm("지금 보고 있는 주제의 외운 기록을 지울까요?")) {
        resetLearned();
      }
    });

    // ------------------------------------------------------------
    // 10. 축하 창과 색종이
    // ------------------------------------------------------------
    function celebrate() {
      const topicName = currentTopic === "전체" ? "" : "'" + currentTopic + "' ";
      document.getElementById("celebrateText").innerHTML = "";
      document.getElementById("celebrateText").append(
        topicName + "단어 " + cards.length + "개를 모두 외웠어요!",
        document.createElement("br"),
        "정말 대단해요! 👏"
      );
      celebrateEl.classList.add("show");

      // 색종이 30개를 위에서 떨어뜨리기
      const pieces = ["🎉", "⭐", "🎈", "💖", "🌸", "✨"];
      for (let i = 0; i < 30; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.textContent = pieces[i % pieces.length];
        c.style.left = Math.random() * 100 + "vw";
        c.style.animationDuration = (2 + Math.random() * 2) + "s";
        c.style.animationDelay = Math.random() * 0.8 + "s";
        document.body.appendChild(c);
        setTimeout(function () { c.remove(); }, 5000);   // 다 떨어지면 지우기
      }
    }

    document.getElementById("closeCelebrateBtn").addEventListener("click", function () {
      celebrateEl.classList.remove("show");
    });

    document.getElementById("restartBtn").addEventListener("click", function () {
      celebrateEl.classList.remove("show");
      resetLearned();
    });

    // ------------------------------------------------------------
    // 11. 발음 듣기 (브라우저의 음성 기능 사용)
    // ------------------------------------------------------------
    function speakWord() {
      if (cards.length === 0) return;
      if (!("speechSynthesis" in window)) {
        alert("이 브라우저는 음성 기능을 지원하지 않아요. 크롬이나 엣지에서 열어 보세요!");
        return;
      }
      window.speechSynthesis.cancel();   // 이전에 읽던 소리는 멈추기

      const speech = new SpeechSynthesisUtterance(cards[currentIndex].english);
      speech.lang = "en-US";   // 미국 영어 발음
      speech.rate = 0.8;       // 조금 천천히 읽기
      window.speechSynthesis.speak(speech);
    }

    document.getElementById("speakBtn").addEventListener("click", speakWord);

    // ------------------------------------------------------------
    // 12. 섞기 (카드 순서를 랜덤으로 바꾸기)
    // ------------------------------------------------------------
    function shuffleCards() {
      // 뒤에서부터 하나씩, 앞쪽의 아무 카드와 자리를 바꿔요.
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      currentIndex = 0;
      showCard();
    }

    document.getElementById("shuffleBtn").addEventListener("click", shuffleCards);

    // ------------------------------------------------------------
    // 13. 주제 고르기
    // ------------------------------------------------------------
    const topicButtons = document.querySelectorAll(".topic-btn");

    function selectTopic(topic) {
      currentTopic = topic;
      topicButtons.forEach(function (b) {
        b.classList.toggle("active", b.dataset.topic === topic);
      });
      buildCards();
      currentIndex = 0;
      showCard();
    }

    topicButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        selectTopic(button.dataset.topic);
      });
    });

    // ------------------------------------------------------------
    // 14. 나만의 단어 만들기 (팝업 창)
    // ------------------------------------------------------------
    const addForm    = document.getElementById("addForm");
    const addMessage = document.getElementById("addMessage");

    function showMessage(text, type) {
      addMessage.textContent = text;
      addMessage.className = "message " + type;
    }

    // 창 열기 / 닫기
    function openAddModal() {
      showMessage("", "");
      addModal.classList.add("show");
      document.getElementById("inEnglish").focus();
    }

    function closeAddModal() {
      addModal.classList.remove("show");
    }

    document.getElementById("openAddBtn").addEventListener("click", openAddModal);
    document.getElementById("closeAddBtn").addEventListener("click", closeAddModal);

    // 창 바깥(흐린 배경)을 누르면 닫기
    addModal.addEventListener("click", function (event) {
      if (event.target === addModal) closeAddModal();
    });

    addForm.addEventListener("submit", function (event) {
      event.preventDefault();   // 페이지가 새로고침되지 않게 막기

      const english = document.getElementById("inEnglish").value.trim();
      const korean  = document.getElementById("inKorean").value.trim();
      const example = document.getElementById("inExample").value.trim();
      const emoji   = document.getElementById("inEmoji").value.trim() || "📝";
      const topic   = document.getElementById("inTopic").value;

      // 꼭 필요한 칸이 비었는지 확인
      if (!english || !korean) {
        showMessage("영어 단어와 한국어 뜻은 꼭 써 주세요! 🙏", "error");
        return;
      }

      // 이미 있는 단어인지 확인
      const exists = getAllWords().some(function (w) {
        return keyOf(w) === english.toLowerCase();
      });
      if (exists) {
        showMessage("'" + english + "'는 이미 있는 단어예요! 😊", "error");
        return;
      }

      // 새 단어 저장하기
      const newWord = { topic: topic, english: english, korean: korean, emoji: emoji, example: example };
      myWords.push(newWord);
      saveMyWords();

      addForm.reset();
      closeAddModal();

      // 방금 만든 카드를 바로 보여 주기
      selectTopic(topic);
      currentIndex = cards.findIndex(function (w) { return keyOf(w) === english.toLowerCase(); });
      showCard();
    });

    // 내가 만든 카드 지우기
    deleteBtn.addEventListener("click", function (event) {
      event.stopPropagation();   // 카드가 뒤집히지 않게 막기
      const item = cards[currentIndex];
      if (!item || !item.mine) return;
      if (!confirm("'" + item.english + "' 카드를 지울까요?")) return;

      myWords = myWords.filter(function (w) { return keyOf(w) !== keyOf(item); });
      learned.delete(keyOf(item));
      saveMyWords();
      saveLearned();

      buildCards();
      if (currentIndex >= cards.length) currentIndex = 0;
      showCard();
    });

    // ------------------------------------------------------------
    // 15. 보너스: 키보드로도 움직일 수 있어요
    //     ← → : 이전/다음,  스페이스: 뒤집기,  엔터: 발음 듣기,  Esc: 창 닫기
    //     (글자를 쓰는 칸에 있을 때는 작동하지 않아요)
    // ------------------------------------------------------------
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeAddModal();
        celebrateEl.classList.remove("show");
        return;
      }

      const tag = event.target.tagName;
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if (celebrateEl.classList.contains("show") || addModal.classList.contains("show")) return;

      if (event.key === "ArrowRight") goNext();
      if (event.key === "ArrowLeft")  goPrev();
      if (event.key === " ") {
        event.preventDefault();
        flipCard();
      }
      if (event.key === "Enter") {
        event.preventDefault();
        speakWord();
      }
    });

    // 처음 페이지가 열리면 '전체' 카드 보여 주기
    selectTopic("전체");
  </script>
</body>
</html>
