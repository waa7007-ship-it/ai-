<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 단어 카드</title>

  <!-- 읽기 편한 글꼴 (인터넷이 안 되면 컴퓨터에 있는 기본 글꼴로 보여요) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- ===================== CSS (모양 꾸미기) ===================== -->
  <style>
    /* ---------- 자주 쓰는 색깔을 이름 붙여 모아 두기 (차분한 색) ---------- */
    :root {
      --bg:          #f3f4f7;
      --surface:     #ffffff;
      --line:        #dde1e8;
      --text:        #2b3140;
      --text-soft:   #6b7385;
      --text-faint:  #9aa1b0;
      --navy:        #34507a;
      --navy-soft:   #e6ecf5;
      --green:       #2f7d5b;
      --green-soft:  #e2f1ea;
      --amber:       #a8661c;
      --amber-soft:  #f8ecdc;
      --red:         #b24a4a;
      --red-soft:    #f8e4e4;

      /* 난이도 색 */
      --lv-basic:     #2f7d5b;
      --lv-basic-bg:  #e2f1ea;
      --lv-mid:       #34507a;
      --lv-mid-bg:    #e6ecf5;
      --lv-high:      #7a3f6e;
      --lv-high-bg:   #f2e6ef;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    /* 화면 한 개 높이 안에 모두 들어가도록 세로로 가운데 정렬 */
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;   /* 휴대폰 주소창 높이까지 생각한 화면 높이 */
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 18px;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
    }

    /* 화면 가운데 모아 두는 상자 */
    .wrap {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.5px;
    }

    /* ---------- 진행 상황 (몇 개 외웠는지) ---------- */
    .progress-box {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 14px 12px;
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .progress-text {
      font-size: 1.05rem;
    }

    .progress-text b {
      color: var(--green);
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: #eceef2;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      border-radius: 999px;
      transition: width 0.5s;
    }

    .reset-btn {
      flex-shrink: 0;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text-soft);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* ---------- 주제 / 난이도 고르기 ---------- */
    .filter {
      width: 100%;
      display: flex;
      gap: 6px;
      overflow-x: auto;              /* 좁은 화면에서는 옆으로 밀어서 보기 */
      scrollbar-width: none;
    }

    .filter::-webkit-scrollbar {
      display: none;
    }

    .filter-label {
      flex-shrink: 0;
      align-self: center;
      font-size: 0.85rem;
      color: var(--text-faint);
      width: 46px;
      white-space: nowrap;
    }

    .chip {
      flex: 1 0 auto;
      font-family: inherit;
      font-size: 0.95rem;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text-soft);
      padding: 8px 12px;
      min-height: 42px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip:hover {
      border-color: var(--navy);
    }

    /* 지금 선택된 버튼 */
    .chip.active {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }

    /* ---------- 카드 (뒤집기 애니메이션) ---------- */
    .card-area {
      width: 100%;
      height: 240px;
      perspective: 1200px;   /* 3D 느낌을 주는 설정 */
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }

    /* 'flipped' 표시가 붙으면 카드가 180도 돌아가요 */
    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(30, 40, 60, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 20px;
      text-align: center;
      backface-visibility: hidden;          /* 뒤쪽 면은 안 보이게 */
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      border-top: 5px solid var(--navy);
    }

    .card-back {
      border-top: 5px solid var(--text-faint);
      transform: rotateY(180deg);           /* 뒷면은 처음부터 돌려 놓기 */
      justify-content: flex-start;
      padding-top: 18px;
      overflow-y: auto;                     /* 내용이 길면 카드 안에서만 스크롤 */
    }

    /* 외운 카드는 위쪽 선이 초록색 */
    .card.learned .card-front {
      border-top-color: var(--green);
    }

    /* 카드 구석에 붙는 작은 표시들 */
    .corner {
      position: absolute;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .corner-tl { top: 10px; left: 12px; }
    .corner-tr { top: 10px; right: 12px; }
    .corner-br { bottom: 8px; right: 12px; }
    .corner-bl { bottom: 8px; left: 12px; }

    .badge {
      font-size: 0.78rem;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .badge-learned { background: var(--green-soft); color: var(--green); display: none; }
    .card.learned .badge-learned { display: inline-block; }

    .badge-mine { background: var(--amber-soft); color: var(--amber); display: none; }
    .card.mine .badge-mine { display: inline-block; }

    .badge-topic { background: #eef0f4; color: var(--text-soft); }

    /* 난이도 표시 */
    .level-기본 { background: var(--lv-basic-bg); color: var(--lv-basic); }
    .level-중급 { background: var(--lv-mid-bg);   color: var(--lv-mid); }
    .level-고급 { background: var(--lv-high-bg);  color: var(--lv-high); }

    .counter {
      font-size: 0.8rem;
      color: var(--text-faint);
    }

    /* 내가 만든 카드 지우기 버튼 */
    .delete-btn {
      font-family: inherit;
      font-size: 0.78rem;
      border: none;
      background: var(--red-soft);
      color: var(--red);
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* 앞면 글자 */
    .word {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      word-break: break-word;
    }

    .word-info {
      margin-top: 6px;
      font-size: 1.05rem;
      color: var(--text-soft);
    }

    .word-info .pos {
      color: var(--navy);
      font-weight: 500;
      margin-right: 8px;
    }

    .hint {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--text-faint);
    }

    /* 뒷면 글자 */
    .meaning {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 10px;
      word-break: keep-all;
    }

    .example {
      width: 100%;
      text-align: left;
      background: #f6f7fa;
      border-left: 3px solid var(--navy);
      padding: 8px 12px;
      border-radius: 8px;
      word-break: break-word;
    }

    .example-en {
      font-size: 1.02rem;
      line-height: 1.4;
    }

    .example-ko {
      margin-top: 2px;
      font-size: 0.9rem;
      color: var(--text-soft);
    }

    .synonyms {
      margin-top: 8px;
      font-size: 0.92rem;
      color: var(--text-soft);
    }

    .synonyms b {
      font-weight: 500;
      color: var(--text);
    }

    /* ---------- 버튼들 ---------- */
    .row {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    .btn {
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 500;
      border: 1px solid transparent;
      color: var(--text);
      padding: 8px 10px;
      min-height: 50px;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.1s, filter 0.15s;
    }

    .btn:hover   { filter: brightness(0.97); }
    .btn:active  { transform: translateY(2px); }

    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* 한 줄에 있는 버튼들은 같은 너비로 나눠 갖기 */
    .row .btn {
      flex: 1 1 0;
      min-width: 0;
    }

    .btn-learned { background: var(--green-soft); color: var(--green); }
    .btn-again   { background: var(--amber-soft); color: var(--amber); }
    .btn-plain   { background: var(--surface); border-color: var(--line); }
    .btn-speak   { background: var(--navy-soft); color: var(--navy); }
    .btn-primary { background: var(--navy); color: #fff; width: 100%; }
    .btn-open    { background: transparent; border: 1px dashed #b9c0cc; color: var(--text-soft); width: 100%; min-height: 46px; }

    /* ---------- 팝업 창 (축하 창, 단어 만들기 창) ---------- */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(30, 36, 50, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      position: relative;
      background: var(--surface);
      border-radius: 18px;
      padding: 22px 20px;
      max-width: 480px;
      width: 100%;
      max-height: 100%;
      overflow-y: auto;      /* 작은 화면이면 창 안에서만 스크롤 */
      box-shadow: 0 20px 50px rgba(20, 30, 50, 0.25);
      animation: pop 0.25s ease-out;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: #eef0f4;
      color: var(--text-soft);
      font-size: 1.1rem;
      cursor: pointer;
    }

    .modal-box h2 {
      margin: 0 0 14px;
      font-size: 1.35rem;
      color: var(--navy);
    }

    .field {
      margin-bottom: 10px;
      flex: 1;
      min-width: 0;
    }

    .field label {
      display: block;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-soft);
      margin-bottom: 4px;
    }

    .field input,
    .field select {
      width: 100%;
      font-family: inherit;
      font-size: 1.05rem;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fafbfc;
      color: var(--text);
    }

    .field input:focus,
    .field select:focus {
      outline: 2px solid var(--navy-soft);
      border-color: var(--navy);
    }

    /* 칸 여러 개를 한 줄에 나란히 */
    .field-row {
      display: flex;
      gap: 10px;
    }

    .message {
      min-height: 1.5em;
      text-align: center;
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    .message.error { color: var(--red); }

    /* 축하 창 */
    .celebrate-box {
      text-align: center;
    }

    .celebrate-emoji {
      font-size: 3.5rem;
    }

    .celebrate-box h2 {
      font-size: 1.6rem;
      margin: 6px 0 8px;
    }

    .celebrate-box p {
      font-size: 1.05rem;
      color: var(--text-soft);
      margin: 0 0 18px;
    }

    @keyframes pop {
      from { transform: scale(0.94); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    /* 떨어지는 색종이 (차분한 색 점) */
    .confetti {
      position: fixed;
      top: -20px;
      width: 9px;
      height: 14px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 11;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(540deg); }
    }

    /* ---------- 휴대폰처럼 좁은 화면일 때 ---------- */
    @media (max-width: 480px) {
      body        { font-size: 16px; padding: 10px 12px; }
      .wrap       { gap: 8px; }
      .chip       { padding: 6px 10px; min-height: 38px; flex-grow: 0; }
      .card-area  { height: 250px; }
      .card-back  { padding: 14px 14px 12px; }
      .word       { font-size: 2rem; }
      .meaning    { font-size: 1.15rem; margin-bottom: 8px; }
      .example    { padding: 6px 10px; }
      .example-en { font-size: 0.95rem; line-height: 1.35; }
      .example-ko { font-size: 0.85rem; }
      .synonyms   { margin-top: 6px; font-size: 0.85rem; }
      .btn        { font-size: 1rem; min-height: 46px; }
      .field-row  { flex-wrap: wrap; gap: 0 10px; }
      .field-row .field { flex: 1 1 40%; }
    }

    /* 키가 조금 작은 화면(노트북 등)에서는 간격을 살짝 줄이기 */
    @media (max-height: 760px) {
      .wrap { gap: 8px; }
      h1    { font-size: 1.3rem; }
    }

    /* 키가 작은 화면(작은 휴대폰)에서는 제목을 숨기고 버튼 높이를 조금 줄이기 */
    @media (max-height: 700px) {
      h1        { display: none; }
      .wrap     { gap: 6px; }
      .chip     { min-height: 36px; }
      .btn      { min-height: 44px; }
      .btn-open { min-height: 40px; }
    }
  </style>
</head>
<body>

  <!-- ===================== HTML (화면에 보이는 내용) ===================== -->
  <div class="wrap">

    <h1>English Vocabulary</h1>

    <!-- 진행 상황 -->
    <div class="progress-box">
      <div class="progress-top">
        <div class="progress-text" id="progressText">50개 중 0개 외웠어요</div>
        <button class="reset-btn" id="resetBtn">처음부터</button>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- 주제 고르기 -->
    <div class="filter" id="topicFilter">
      <span class="filter-label">주제</span>
      <button class="chip active" data-topic="전체">전체</button>
      <button class="chip" data-topic="비즈니스">비즈니스</button>
      <button class="chip" data-topic="일상 회화">일상 회화</button>
      <button class="chip" data-topic="감정/성격">감정/성격</button>
      <button class="chip" data-topic="사회/뉴스">사회/뉴스</button>
      <button class="chip" data-topic="여행/생활">여행/생활</button>
      <button class="chip" data-topic="내 단어">내 단어</button>
    </div>

    <!-- 난이도 고르기 -->
    <div class="filter" id="levelFilter">
      <span class="filter-label">난이도</span>
      <button class="chip active" data-level="전체">전체</button>
      <button class="chip" data-level="기본">기본</button>
      <button class="chip" data-level="중급">중급</button>
      <button class="chip" data-level="고급">고급</button>
    </div>

    <!-- 단어 카드 -->
    <div class="card-area">
      <div class="card" id="card">
        <!-- 앞면: 단어 + 품사 + 발음기호 -->
        <div class="card-face card-front">
          <div class="corner corner-tl">
            <span class="badge" id="levelBadge">중급</span>
            <span class="badge badge-topic" id="topicBadge">비즈니스</span>
            <span class="badge badge-mine">내 단어</span>
          </div>
          <div class="corner corner-tr">
            <span class="badge badge-learned">✓ 외웠어요</span>
          </div>
          <div class="word" id="word">negotiate</div>
          <div class="word-info">
            <span class="pos" id="pos">동사</span>
            <span id="ipa">/nɪˈɡoʊʃieɪt/</span>
          </div>
          <div class="hint">카드를 누르면 뜻이 보여요</div>
          <div class="corner corner-bl">
            <button class="delete-btn" id="deleteBtn" hidden>🗑️ 지우기</button>
          </div>
          <div class="corner corner-br">
            <span class="counter" id="counter">1 / 50</span>
          </div>
        </div>
        <!-- 뒷면: 뜻 + 예문 + 해석 + 유의어 -->
        <div class="card-face card-back">
          <div class="meaning" id="meaning">협상하다</div>
          <div class="example">
            <div class="example-en" id="exampleEn">We need to negotiate a better price.</div>
            <div class="example-ko" id="exampleKo">우리는 더 좋은 가격으로 협상해야 해요.</div>
          </div>
          <div class="synonyms" id="synonyms"><b>유의어</b> bargain, discuss</div>
        </div>
      </div>
    </div>

    <!-- 외웠어요 / 다시 볼래요 -->
    <div class="row">
      <button class="btn btn-learned" id="learnedBtn">✅ 외웠어요</button>
      <button class="btn btn-again" id="againBtn">🔁 다시 볼래요</button>
    </div>

    <!-- 발음 듣기 / 예문 듣기 -->
    <div class="row">
      <button class="btn btn-speak" id="speakBtn">🔊 발음 듣기</button>
      <button class="btn btn-speak" id="speakExampleBtn">🔊 예문 듣기</button>
    </div>

    <!-- 이전 / 섞기 / 다음 -->
    <div class="row">
      <button class="btn btn-plain" id="prevBtn">◀ 이전</button>
      <button class="btn btn-plain" id="shuffleBtn">🔀 섞기</button>
      <button class="btn btn-plain" id="nextBtn">다음 ▶</button>
    </div>

    <!-- 단어 만들기 창 열기 버튼 -->
    <button class="btn btn-open" id="openAddBtn">＋ 나만의 단어 만들기</button>
  </div>

  <!-- 단어 만들기 창 (버튼을 누르면 나타나요) -->
  <div class="modal" id="addModal">
    <form class="modal-box" id="addForm">
      <button type="button" class="close-btn" id="closeAddBtn" aria-label="닫기">✕</button>
      <h2>나만의 단어 만들기</h2>

      <div class="field-row">
        <div class="field">
          <label for="inEnglish">영어 단어 *</label>
          <input id="inEnglish" type="text" placeholder="예: persuade" autocomplete="off">
        </div>
        <div class="field">
          <label for="inIpa">발음기호</label>
          <input id="inIpa" type="text" placeholder="예: /pərˈsweɪd/" autocomplete="off">
        </div>
      </div>

      <div class="field">
        <label for="inMeaning">한국어 뜻 * (2개까지, 쉼표로 구분)</label>
        <input id="inMeaning" type="text" placeholder="예: 설득하다, 납득시키다" autocomplete="off">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="inPos">품사</label>
          <select id="inPos">
            <option>동사</option>
            <option>명사</option>
            <option>형용사</option>
            <option>부사</option>
            <option>구동사</option>
            <option>전치사</option>
            <option>접속사</option>
            <option>기타</option>

      { topic: "여행/생활", english: "layover", pos: "명사", ipa: "/ˈleɪoʊvər/", level: "중급",
        meanings: ["(비행기) 경유 대기", "잠시 머묾"],
        example: "We have a three-hour layover in Tokyo.", exampleKo: "도쿄에서 3시간 경유 대기가 있어요.",
        synonyms: ["stopover", "connection"] },
      { topic: "여행/생활", english: "complimentary", pos: "형용사", ipa: "/ˌkɑːmplɪˈmentri/", level: "고급",
        meanings: ["무료의", "칭찬하는"],
        example: "The hotel offers complimentary breakfast.", exampleKo: "그 호텔은 무료 조식을 제공해요.",
        synonyms: ["free", "on the house"] },
      { topic: "여행/생활", english: "amenity", pos: "명사", ipa: "/əˈmenəti/", level: "고급",
        meanings: ["편의 시설", "생활 편의 용품"],
        example: "The apartment is close to shops and other amenities.", exampleKo: "그 아파트는 상점과 다른 편의 시설이 가까워요.",
        synonyms: ["facility", "convenience"] }
    ];

    // 주제 목록 (단어 만들기 창과 옛 기록 정리에 사용)
    const TOPICS = ["비즈니스", "일상 회화", "감정/성격", "사회/뉴스", "여행/생활", "내 단어"];
    const LEVELS = ["기본", "중급", "고급"];

    // ------------------------------------------------------------
    // 2. 브라우저에 저장하고 불러오기 (localStorage)
    //    브라우저를 껐다 켜도 남아 있게 해 줘요.
    //    혹시 저장이 막힌 브라우저여도 페이지가 멈추지 않도록 try/catch로 감싸요.
    // ------------------------------------------------------------
    const SAVE_KEY_MY_WORDS   = "wordcards-my-words";     // 내가 만든 단어 (예전과 같은 이름)
    const SAVE_KEY_LEARNED    = "wordcards-v2-learned";   // 새 '외웠어요' 기록
    const OLD_KEY_LEARNED     = "wordcards-learned";      // 예전 '외웠어요' 기록

    function loadData(key, defaultValue) {
      try {
        const text = localStorage.getItem(key);
        return text ? JSON.parse(text) : defaultValue;
      } catch (error) {
        return defaultValue;
      }
    }

    function saveData(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        // 저장할 수 없는 환경이면 조용히 넘어가요.
      }
    }

    function removeData(key) {
      try {
        localStorage.removeItem(key);
      } catch (error) {
        // 지울 수 없는 환경이면 조용히 넘어가요.
      }
    }

    // 단어를 구별하는 이름표 (대문자/소문자 차이는 무시)
    // 기본 단어는 "base:", 내가 만든 단어는 "my:"를 앞에 붙여서 서로 섞이지 않게 해요.
    function keyOf(word) {
      return (word.mine ? "my:" : "base:") + word.english.trim().toLowerCase();
    }

    // 예전 모양으로 저장된 '내 단어'를 새 모양으로 바꿔 주기
    // (예전: korean, emoji / 새: meanings, pos, ipa, level, exampleKo, synonyms)
    function normalizeMyWord(w) {
      let meanings = w.meanings;
      if (!Array.isArray(meanings)) {
        meanings = w.korean ? [w.korean] : [];
      }
      return {
        topic:     TOPICS.includes(w.topic) ? w.topic : "내 단어",   // 예전 주제(동물 등)는 '내 단어'로
        english:   String(w.english || ""),
        pos:       w.pos || "",
        ipa:       w.ipa || "",
        level:     LEVELS.includes(w.level) ? w.level : "",          // 모르면 비워 두기
        meanings:  meanings.slice(0, 2),
        example:   w.example || "",
        exampleKo: w.exampleKo || "",
        synonyms:  Array.isArray(w.synonyms) ? w.synonyms : []
      };
    }

    // 내가 추가한 단어들 (예전 단어도 지우지 않고 새 모양으로 바꿔서 그대로 남겨요)
    let myWords = loadData(SAVE_KEY_MY_WORDS, [])
      .map(normalizeMyWord)
      .filter(function (w) { return w.english; });
    saveData(SAVE_KEY_MY_WORDS, myWords);

    // 외운 단어 기록
    let learned = new Set(loadData(SAVE_KEY_LEARNED, []));

    // 예전 '외웠어요' 기록 정리하기 (한 번만 실행돼요)
    //  - 예전 기본 단어(dog, apple 등) 기록은 버려요.
    //  - 내가 직접 만든 단어의 기록만 새 기록으로 옮겨요.
    const oldLearned = loadData(OLD_KEY_LEARNED, null);
    if (Array.isArray(oldLearned)) {
      const myKeys = myWords.map(function (w) { return w.english.trim().toLowerCase(); });
      oldLearned.forEach(function (k) {
        if (myKeys.includes(k)) learned.add("my:" + k);
      });
      removeData(OLD_KEY_LEARNED);
      saveData(SAVE_KEY_LEARNED, [...learned]);
    }

    function saveMyWords() { saveData(SAVE_KEY_MY_WORDS, myWords); }
    function saveLearned() { saveData(SAVE_KEY_LEARNED, [...learned]); }

    // ------------------------------------------------------------
    // 3. 지금 상태를 기억하는 변수
    // ------------------------------------------------------------
    let currentTopic = "전체";   // 지금 고른 주제
    let currentLevel = "전체";   // 지금 고른 난이도
    let cards = [];              // 지금 보여 줄 카드 목록
    let currentIndex = 0;        // 지금 보고 있는 카드 번호 (0부터 시작)

    // 기본 단어 + 내가 만든 단어를 합친 전체 목록
    function getAllWords() {
      return baseWords.concat(myWords.map(function (w) {
        return Object.assign({}, w, { mine: true });
      }));
    }

    // 고른 주제와 난이도에 맞는 카드만 골라서 cards에 넣기
    function buildCards() {
      cards = getAllWords().filter(function (w) {
        const topicOk = currentTopic === "전체" || w.topic === currentTopic;
        const levelOk = currentLevel === "전체" || w.level === currentLevel;
        return topicOk && levelOk;
      });
    }

    // ------------------------------------------------------------
    // 4. 화면 요소 가져오기
    // ------------------------------------------------------------
    const $ = function (id) { return document.getElementById(id); };

    const cardEl       = $("card");
    const wordEl       = $("word");
    const posEl        = $("pos");
    const ipaEl        = $("ipa");
    const levelBadge   = $("levelBadge");
    const topicBadge   = $("topicBadge");
    const meaningEl    = $("meaning");
    const exampleEnEl  = $("exampleEn");
    const exampleKoEl  = $("exampleKo");
    const synonymsEl   = $("synonyms");
    const counterEl    = $("counter");
    const progressText = $("progressText");
    const progressFill = $("progressFill");
    const deleteBtn    = $("deleteBtn");
    const celebrateEl  = $("celebrate");
    const addModal     = $("addModal");

    // 카드가 하나도 없을 때(예: '내 단어'를 아직 안 만들었을 때) 버튼 막기
    const cardButtons = ["learnedBtn", "againBtn", "prevBtn", "nextBtn", "speakBtn", "speakExampleBtn", "shuffleBtn"].map($);

    // ------------------------------------------------------------
    // 5. 지금 카드를 화면에 그리는 함수
    // ------------------------------------------------------------
    function showCard() {
      cardEl.classList.remove("flipped");   // 새 카드는 항상 앞면부터

      // 카드가 없으면 안내 문구 보여 주기
      if (cards.length === 0) {
        wordEl.textContent      = "카드가 없어요";
        posEl.textContent       = "";
        ipaEl.textContent       = "다른 주제나 난이도를 고르거나, 아래에서 단어를 만들어 보세요.";
        levelBadge.hidden       = true;
        topicBadge.hidden       = true;
        meaningEl.textContent   = "카드가 없어요";
        exampleEnEl.textContent = "";
        exampleKoEl.textContent = "";
        synonymsEl.textContent  = "";
        counterEl.textContent   = "0 / 0";
        cardEl.classList.remove("learned", "mine");
        deleteBtn.hidden = true;
        cardButtons.forEach(function (b) { b.disabled = true; });
        updateProgress();
        return;
      }
      cardButtons.forEach(function (b) { b.disabled = false; });

      const item = cards[currentIndex];

      // 앞면
      wordEl.textContent = item.english;
      posEl.textContent  = item.pos;
      ipaEl.textContent  = item.ipa;
      levelBadge.hidden  = !item.level;
      levelBadge.textContent = item.level;
      levelBadge.className = "badge level-" + item.level;
      topicBadge.hidden  = item.mine && item.topic === "내 단어";   // '내 단어' 표시와 겹치지 않게
      topicBadge.textContent = item.topic;

      // 뒷면
      meaningEl.textContent = item.meanings
        .map(function (m, i) { return item.meanings.length > 1 ? (i + 1) + ". " + m : m; })
        .join("   ");
      exampleEnEl.textContent = item.example || "(예문이 없어요)";
      exampleKoEl.textContent = item.exampleKo || "";

      synonymsEl.textContent = "";
      if (item.synonyms && item.synonyms.length > 0) {
        const label = document.createElement("b");
        label.textContent = "유의어 ";
        synonymsEl.append(label, item.synonyms.join(", "));
      }

      counterEl.textContent = (currentIndex + 1) + " / " + cards.length;

      // 외운 카드, 내가 만든 카드 표시
      cardEl.classList.toggle("learned", learned.has(keyOf(item)));
      cardEl.classList.toggle("mine", !!item.mine);
      deleteBtn.hidden = !item.mine;

      // '예문 듣기'는 예문이 있을 때만
      $("speakExampleBtn").disabled = !item.example;

      updateProgress();
    }

    // ------------------------------------------------------------
    // 6. 진행 상황 (몇 개 외웠는지) 보여 주기
    // ------------------------------------------------------------
    function countLearned() {
      return cards.filter(function (w) { return learned.has(keyOf(w)); }).length;
    }

    function updateProgress() {
      const total = cards.length;
      const done  = countLearned();
      const percent = total === 0 ? 0 : Math.round((done / total) * 100);

      progressText.textContent = "";   // 비우고 다시 쓰기
      const b = document.createElement("b");
      b.textContent = done + "개";
      progressText.append(total + "개 중 ", b, " 외웠어요");

      progressFill.style.width = percent + "%";
    }

    // ------------------------------------------------------------
    // 7. 카드 뒤집기 (카드를 클릭하면 실행)
    // ------------------------------------------------------------
    function flipCard() {
      if (cards.length > 0) cardEl.classList.toggle("flipped");
    }
    cardEl.addEventListener("click", flipCard);

    // ------------------------------------------------------------
    // 8. 이전 / 다음 버튼 (끝에서 넘기면 처음으로 돌아가요)
    // ------------------------------------------------------------
    function goNext() {
      if (cards.length === 0) return;
      currentIndex = (currentIndex + 1) % cards.length;
      showCard();
    }

    function goPrev() {
      if (cards.length === 0) return;
      currentIndex = (currentIndex - 1 + cards.length) % cards.length;
      showCard();
    }

    $("nextBtn").addEventListener("click", goNext);
    $("prevBtn").addEventListener("click", goPrev);

    // ------------------------------------------------------------
    // 9. 외웠어요 / 다시 볼래요
    // ------------------------------------------------------------
    function markLearned() {
      if (cards.length === 0) return;
      const wasAllDone = countLearned() === cards.length;

      learned.add(keyOf(cards[currentIndex]));
      saveLearned();

      // 방금 눌러서 전부 외우게 되었으면 축하!
      if (!wasAllDone && countLearned() === cards.length) {
        showCard();
        celebrate();
      } else {
        goNext();
      }
    }

    function markAgain() {
      if (cards.length === 0) return;
      learned.delete(keyOf(cards[currentIndex]));
      saveLearned();
      goNext();
    }

    $("learnedBtn").addEventListener("click", markLearned);
    $("againBtn").addEventListener("click", markAgain);

    // 외운 기록 지우기 (지금 보고 있는 카드들만)
    function resetLearned() {
      cards.forEach(function (w) { learned.delete(keyOf(w)); });
      saveLearned();
      currentIndex = 0;
      showCard();
    }

    $("resetBtn").addEventListener("click", function () {
      if (confirm("지금 보고 있는 카드들의 외운 기록을 지울까요?")) {
        resetLearned();
      }
    });

    // ------------------------------------------------------------
    // 10. 축하 창과 색종이
    // ------------------------------------------------------------
    function celebrate() {
      const parts = [];
      if (currentTopic !== "전체") parts.push("'" + currentTopic + "'");
      if (currentLevel !== "전체") parts.push("'" + currentLevel + "'");
      const scope = parts.length ? parts.join(" ") + " " : "";
      $("celebrateText").textContent = scope + "단어 " + cards.length + "개를 모두 외웠어요. 수고하셨어요!";
      celebrateEl.classList.add("show");

      // 차분한 색 색종이 40개를 위에서 떨어뜨리기
      const colors = ["#34507a", "#2f7d5b", "#a8661c", "#7a3f6e", "#9aa1b0"];
      for (let i = 0; i < 40; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.background = colors[i % colors.length];
        c.style.left = Math.random() * 100 + "vw";
        c.style.animationDuration = (2 + Math.random() * 2) + "s";
        c.style.animationDelay = Math.random() * 0.8 + "s";
        document.body.appendChild(c);
        setTimeout(function () { c.remove(); }, 5000);   // 다 떨어지면 지우기
      }
    }

    $("closeCelebrateBtn").addEventListener("click", function () {
      celebrateEl.classList.remove("show");
    });

    $("restartBtn").addEventListener("click", function () {
      celebrateEl.classList.remove("show");
      resetLearned();
    });

    // ------------------------------------------------------------
    // 11. 발음 듣기 / 예문 듣기 (브라우저의 음성 기능 사용)
    // ------------------------------------------------------------
    function speak(text, rate) {
      if (!text) return;
      if (!("speechSynthesis" in window)) {
        alert("이 브라우저는 음성 기능을 지원하지 않아요. 크롬이나 엣지에서 열어 보세요.");
        return;
      }
      window.speechSynthesis.cancel();   // 이전에 읽던 소리는 멈추기

      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = "en-US";   // 미국 영어 발음
      speech.rate = rate;
      window.speechSynthesis.speak(speech);
    }

    function speakWord() {
      if (cards.length === 0) return;
      speak(cards[currentIndex].english, 0.85);
    }

    function speakExample() {
      if (cards.length === 0) return;
      speak(cards[currentIndex].example, 0.9);
    }

    $("speakBtn").addEventListener("click", speakWord);
    $("speakExampleBtn").addEventListener("click", speakExample);

    // ------------------------------------------------------------
    // 12. 섞기 (카드 순서를 랜덤으로 바꾸기)
    // ------------------------------------------------------------
    function shuffleCards() {
      // 뒤에서부터 하나씩, 앞쪽의 아무 카드와 자리를 바꿔요.
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      currentIndex = 0;
      showCard();
    }

    $("shuffleBtn").addEventListener("click", shuffleCards);

    // ------------------------------------------------------------
    // 13. 주제 / 난이도 고르기
    // ------------------------------------------------------------
    const topicButtons = document.querySelectorAll("[data-topic]");
    const levelButtons = document.querySelectorAll("[data-level]");

    function applyFilter() {
      topicButtons.forEach(function (b) { b.classList.toggle("active", b.dataset.topic === currentTopic); });
      levelButtons.forEach(function (b) { b.classList.toggle("active", b.dataset.level === currentLevel); });
      buildCards();
      currentIndex = 0;
      showCard();
    }

    topicButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        currentTopic = button.dataset.topic;
        applyFilter();
      });
    });

    levelButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        currentLevel = button.dataset.level;
        applyFilter();
      });
    });

    // ------------------------------------------------------------
    // 14. 나만의 단어 만들기 (팝업 창)
    // ------------------------------------------------------------
    const addForm    = $("addForm");
    const addMessage = $("addMessage");

    function showMessage(text, type) {
      addMessage.textContent = text;
      addMessage.className = "message " + type;
    }

    // 쉼표로 나눠서 빈칸 없는 목록으로 만들기 ("a, b," → ["a", "b"])
    function splitList(text) {
      return text.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
    }

    // 창 열기 / 닫기
    function openAddModal() {
      showMessage("", "");
      addModal.classList.add("show");
      $("inEnglish").focus();
    }

    function closeAddModal() {
      addModal.classList.remove("show");
    }

    $("openAddBtn").addEventListener("click", openAddModal);
    $("closeAddBtn").addEventListener("click", closeAddModal);

    // 창 바깥(어두운 배경)을 누르면 닫기
    addModal.addEventListener("click", function (event) {
      if (event.target === addModal) closeAddModal();
    });

    addForm.addEventListener("submit", function (event) {
      event.preventDefault();   // 페이지가 새로고침되지 않게 막기

      const english  = $("inEnglish").value.trim();
      const meanings = splitList($("inMeaning").value);

      // 꼭 필요한 칸이 비었는지 확인
      if (!english || meanings.length === 0) {
        showMessage("영어 단어와 한국어 뜻은 꼭 입력해 주세요.", "error");
        return;
      }

      // 이미 만든 단어인지 확인 (기본 단어와 같은 단어는 '내 단어'로 따로 만들 수 있어요)
      const exists = myWords.some(function (w) {
        return w.english.toLowerCase() === english.toLowerCase();
      });
      if (exists) {
        showMessage("'" + english + "'는 이미 내 단어에 있어요.", "error");
        return;
      }

      // 새 단어 저장하기
      const newWord = {
        topic:     $("inTopic").value,
        english:   english,
        pos:       $("inPos").value,
        ipa:       $("inIpa").value.trim(),
        level:     $("inLevel").value,
        meanings:  meanings.slice(0, 2),
        example:   $("inExample").value.trim(),
        exampleKo: $("inExampleKo").value.trim(),
        synonyms:  splitList($("inSynonyms").value)
      };
      myWords.push(newWord);
      saveMyWords();

      addForm.reset();
      closeAddModal();

      // 방금 만든 카드를 바로 보여 주기
      currentTopic = newWord.topic;
      currentLevel = "전체";
      applyFilter();
      currentIndex = cards.findIndex(function (w) {
        return w.mine && w.english.toLowerCase() === english.toLowerCase();
      });
      showCard();
    });

    // 내가 만든 카드 지우기
    deleteBtn.addEventListener("click", function (event) {
      event.stopPropagation();   // 카드가 뒤집히지 않게 막기
      const item = cards[currentIndex];
      if (!item || !item.mine) return;
      if (!confirm("'" + item.english + "' 카드를 지울까요?")) return;

      myWords = myWords.filter(function (w) {
        return w.english.toLowerCase() !== item.english.toLowerCase();
      });
      learned.delete(keyOf(item));
      saveMyWords();
      saveLearned();

      buildCards();
      if (currentIndex >= cards.length) currentIndex = 0;
      showCard();
    });

    // ------------------------------------------------------------
    // 15. 키보드로도 움직일 수 있어요
    //     ← → : 이전/다음,  스페이스: 뒤집기,  엔터: 발음 듣기,  E: 예문 듣기,  Esc: 창 닫기
    //     (글자를 쓰는 칸에 있을 때는 작동하지 않아요)
    // ------------------------------------------------------------
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeAddModal();
        celebrateEl.classList.remove("show");
        return;
      }

      const tag = event.target.tagName;
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if (celebrateEl.classList.contains("show") || addModal.classList.contains("show")) return;

      if (event.key === "ArrowRight") goNext();
      if (event.key === "ArrowLeft")  goPrev();
      if (event.key === " ") {
        event.preventDefault();
        flipCard();
      }
      if (event.key === "Enter") {
        event.preventDefault();
        speakWord();
      }
      if (event.key === "e" || event.key === "E") speakExample();
    });

    // 처음 페이지가 열리면 '전체' 카드 보여 주기
    applyFilter();
  </script>
</body>
</html>
